# Test, plan and publish the layer: dev branch -> test and plan only,
# main -> test, plan, then publish a new layer version (after approval).
#
# AWS access is through OIDC roles defined in infra/github/. The plan job uses
# the readonly role; the publish job runs in the GitHub environment prod and
# uses its deploy role. The prod environment requires a reviewer, so a run on
# main stops before publishing until the plan job's summary has been checked
# and the run approved.
#
# Settings (role ARNs, region) are in pipeline/env/.

name: deploy

on:
  push:
    branches: [dev, main]

permissions:
  id-token: write
  contents: read

defaults:
  run:
    shell: bash

env:
  PYTHON_VERSION: "3.12"
  TERRAFORM_VERSION: "1.16.5"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: pip install -r tests/requirements.txt
      - run: make test

  # What the publish job will change, written to the job summary. Read this
  # before approving a run on main.
  plan:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipeline/load_env.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.READONLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make layer
      # -lock=false: the readonly role can't write the lock file
      - name: terraform plan
        working-directory: infra
        run: |
          terraform init -reconfigure -input=false -backend-config=backend.hcl
          terraform plan -input=false -lock=false -no-color | tee plan.txt
          { echo "## terraform plan"; echo '```'; cat plan.txt; echo '```'; } >> "$GITHUB_STEP_SUMMARY"

  # terraform apply re-plans rather than applying the plan job's plan, which
  # would have to be passed as a (public) artifact.
  publish:
    needs: plan
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: publish
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: pipeline/load_env.sh
      - uses: aws-actions/configure-aws-credentials@e1253824e5c10ff9df46874f81ed3ec929e19cfd # v6.3.0
        with:
          role-to-assume: ${{ env.DEPLOY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          mask-aws-account-id: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}
          terraform_wrapper: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: make layer
      - name: terraform apply
        working-directory: infra
        run: |
          terraform init -reconfigure -input=false -backend-config=backend.hcl
          terraform apply -input=false -auto-approve -no-color
          { echo "## terraform apply"; echo '```'; terraform output -no-color; echo '```'; } >> "$GITHUB_STEP_SUMMARY"
